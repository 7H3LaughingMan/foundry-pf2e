name: PF2e/Foundry Types CI

on:
    push:
        branches:
            - v13
    pull_request:
        branches:
            - v13

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
              id: checkout

            - uses: actions/setup-node@v6
              id: setup-node
              with:
                  node-version: 24

            - uses: actions/cache@v5
              id: cache
              with:
                  path: node_modules/
                  key: npm-${{ hashFiles('package-lock.json') }}

            - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
              run: npm ci

            - run: npm run tsc

            - run: npm run eslint
